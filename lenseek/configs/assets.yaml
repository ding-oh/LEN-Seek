# Release assets: the single place for download locations, sizes, checksums and licenses.
# `lenseek-fetch <name>` downloads to $LENSEEK_HOME/assets/<file> and checks size and SHA-256; `kind: tar` assets are
# unpacked to $LENSEEK_HOME/assets/<name>/ (`root` = the directory returned inside it).
# url: null      -> not published yet (lenseek-fetch says so; LENSEEK_ASSET_MIRROR can point to a copy). The data-record
#                  assets download from Zenodo once published: bsitepdb from record 24492368 (BsitePDB,
#                  doi:10.5281/zenodo.24492368), the others from record 24491227 (LEN-Seek data,
#                  doi:10.5281/zenodo.24491227).
# license: null  -> not decided yet.

